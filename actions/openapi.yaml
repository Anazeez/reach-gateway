{
  "openapi": "3.1.0",
  "info": {
    "title": "Reach the G",
    "version": "0.2.0",
    "description": "Owner-private, read-only retrieval of normalized public evidence."
  },
  "servers": [
    {
      "url": "https://reach-gateway.izeesub.workers.dev"
    }
  ],
  "security": [
    {
      "oauth": [
        "reach:read"
      ]
    }
  ],
  "paths": {
    "/v1/reach/read": {
      "post": {
        "operationId": "readPublicUrl",
        "summary": "Read one public HTTPS URL",
        "description": "Retrieve inert public evidence with provenance.",
        "security": [
          {
            "oauth": [
              "reach:read"
            ]
          }
        ],
        "requestBody": {
          "$ref": "#/components/requestBodies/PublicUrl"
        },
        "responses": {
          "200": {
            "$ref": "#/components/responses/ReachResult"
          },
          "400": {
            "description": "Invalid request"
          },
          "401": {
            "description": "Authentication required"
          },
          "404": {
            "description": "Action unavailable"
          },
          "500": {
            "description": "Bounded internal failure"
          }
        },
        "x-openai-isConsequential": false
      }
    },
    "/v1/reach/transcript": {
      "post": {
        "operationId": "getPublicTranscript",
        "summary": "Get available public YouTube captions",
        "description": "Retrieve captions for one supported public YouTube URL.",
        "security": [
          {
            "oauth": [
              "reach:read"
            ]
          }
        ],
        "requestBody": {
          "$ref": "#/components/requestBodies/PublicUrl"
        },
        "responses": {
          "200": {
            "$ref": "#/components/responses/ReachResult"
          },
          "400": {
            "description": "Invalid request"
          },
          "401": {
            "description": "Authentication required"
          },
          "404": {
            "description": "Action unavailable"
          },
          "500": {
            "description": "Bounded internal failure"
          }
        },
        "x-openai-isConsequential": false
      }
    },
    "/v1/reach/health": {
      "post": {
        "operationId": "checkEvidenceChannels",
        "summary": "Check Reach evidence channels",
        "description": "Report bounded availability for public evidence channels.",
        "security": [
          {
            "oauth": [
              "reach:read"
            ]
          }
        ],
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "sources": {
                    "type": "array",
                    "maxItems": 5,
                    "uniqueItems": true,
                    "items": {
                      "type": "string",
                      "enum": [
                        "web",
                        "x",
                        "youtube",
                        "reddit",
                        "rss"
                      ]
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "$ref": "#/components/responses/ReachResult"
          },
          "400": {
            "description": "Invalid request"
          },
          "401": {
            "description": "Authentication required"
          },
          "404": {
            "description": "Action unavailable"
          },
          "500": {
            "description": "Bounded internal failure"
          }
        },
        "x-openai-isConsequential": false
      }
    }
  },
  "components": {
    "schemas": {
      "ReachEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "passed",
              "failed",
              "unavailable"
            ]
          },
          "source": {
            "type": "string",
            "enum": [
              "web",
              "x",
              "youtube",
              "reddit",
              "rss"
            ]
          },
          "operation": {
            "type": "string",
            "enum": [
              "read",
              "transcript",
              "health"
            ]
          },
          "canonicalUrl": {
            "type": [
              "string",
              "null"
            ],
            "format": "uri"
          },
          "retrievedAt": {
            "type": "string",
            "format": "date-time"
          },
          "backend": {
            "type": "string"
          },
          "content": {
            "type": [
              "string",
              "null"
            ]
          },
          "items": {
            "type": "array",
            "items": {}
          },
          "citations": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "title": {
                  "type": "string"
                },
                "url": {
                  "type": "string",
                  "format": "uri"
                }
              },
              "required": [
                "title",
                "url"
              ]
            }
          },
          "warnings": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "reasonCode": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "status",
          "source",
          "operation",
          "canonicalUrl",
          "retrievedAt",
          "backend",
          "content",
          "items",
          "citations",
          "warnings",
          "reasonCode"
        ]
      },
      "PublicUrlInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "url": {
            "type": "string",
            "format": "uri",
            "pattern": "^https://"
          }
        },
        "required": [
          "url"
        ]
      }
    },
    "requestBodies": {
      "PublicUrl": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/PublicUrlInput"
            }
          }
        }
      }
    },
    "responses": {
      "ReachResult": {
        "description": "Normalized public evidence result",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ReachEnvelope"
            }
          }
        }
      }
    },
    "securitySchemes": {
      "oauth": {
        "type": "oauth2",
        "flows": {
          "authorizationCode": {
            "authorizationUrl": "https://noisy-pond-95ae.cloudflareaccess.com/cdn-cgi/access/oauth/authorization",
            "tokenUrl": "https://noisy-pond-95ae.cloudflareaccess.com/cdn-cgi/access/oauth/token",
            "scopes": {
              "reach:read": "Read public evidence through the owner-private Reach gateway"
            }
          }
        }
      }
    }
  }
}
